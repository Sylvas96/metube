name: fork-image

# Fork-only: test the multi-user branch and publish its image to GHCR.
on:
  push:
    branches: ['multi-user']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --group dev
      - run: uv run python -m compileall -q app
      - run: uv run pytest app/tests/

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.date }}-multiuser
          tags: |
            ${{ steps.meta.outputs.image }}:multi-user
            ${{ steps.meta.outputs.image }}:multi-user-${{ steps.meta.outputs.date }}
