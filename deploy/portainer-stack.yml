# Pile Portainer "metube" — Stacks > Add stack > Web editor : coller ce fichier tel quel.
# Aucun fichier à déposer sur le serveur.
#
# Variables de pile obligatoires (Portainer > Environment variables) :
#   AUTHELIA_URL   adresse interne d'Authelia, ex. http://192.168.x.x:9091
#   METUBE_IP      adresse de la passerelle sur le réseau macvlan
#   ADMIN_USER     compte qui gère abonnements et cookies
#   METUBE_IMAGE   image construite par le fork, ex. ghcr.io/<compte>/metube:multi-user
#
# La configuration nginx ci-dessous est celle de deploy/gateway/default.conf.template,
# avec les "$" doublés ("$$") comme l'exige Compose.

services:
  # Seul conteneur joignable depuis le réseau : authentifie via Authelia.
  gateway:
    image: nginx:stable-alpine
    container_name: metube-gateway
    restart: unless-stopped
    environment:
      TZ: America/Toronto
      NGINX_CONF: |
        # Passerelle MeTube : seule porte d'entrée. Elle demande à Authelia qui est
        # connecté et transmet le compte à MeTube dans l'en-tête Remote-User.

        resolver 127.0.0.11 valid=10s ipv6=off;          # DNS interne de Docker

        map $$http_upgrade $$connection_upgrade { default upgrade; '' close; }
        map $$http_x_forwarded_proto $$orig_scheme { default https; http http; }

        server {
            listen 80;
            server_tokens off;
            client_max_body_size 10m;

            auth_request /internal/authelia/authz;
            auth_request_set $$authelia_user     $$upstream_http_remote_user;
            auth_request_set $$authelia_redirect $$upstream_http_location;
            error_page 401 =302 $$authelia_redirect;

            location = /internal/authelia/authz {
                internal;
                proxy_pass ${AUTHELIA_URL}/api/authz/auth-request;
                proxy_http_version 1.1;
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                proxy_set_header Connection "";
                proxy_set_header X-Original-Method $$request_method;
                proxy_set_header X-Original-URL $$orig_scheme://$$http_host$$request_uri;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            }

            location / {
                set $$metube http://metube:8081;          # résolu à la demande
                proxy_pass $$metube;
                proxy_http_version 1.1;
                proxy_set_header Host $$http_host;
                proxy_set_header Remote-User $$authelia_user;   # écrase toute valeur envoyée par le client
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;
                proxy_buffering off;                     # fichiers envoyés en flux direct
                proxy_read_timeout 3600s;
            }
        }
    command:
      - sh
      - -c
      - printf '%s\n' "$$NGINX_CONF" > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    networks:
      docker-lan:
        ipv4_address: "${METUBE_IP}"
        priority: 1000
      backend: {}

  # MeTube multi-utilisateur : jamais exposé directement.
  metube:
    image: "${METUBE_IMAGE}"
    container_name: metube-server
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "077"
      TZ: America/Toronto
      AUTH_USER_HEADER: Remote-User
      ADMIN_USER: "${ADMIN_USER}"
      MAX_CONCURRENT_DOWNLOADS: "${MAX_CONCURRENT_DOWNLOADS:-3}"     # par utilisateur
      CLEAR_COMPLETED_AFTER: "${CLEAR_COMPLETED_AFTER:-86400}"       # 24 h
      DELETE_FILE_ON_TRASHCAN: "true"
      CUSTOM_DIRS: "false"
    volumes:
      - /docker/metube/downloads:/downloads
    networks:
      - backend

  # Filet de sécurité : supprime les fichiers plus vieux que RETENTION_HOURS,
  # y compris après un redémarrage de MeTube.
  cleanup:
    image: alpine:3
    container_name: metube-cleanup
    restart: unless-stopped
    network_mode: none
    environment:
      RETENTION_HOURS: "${RETENTION_HOURS:-25}"
    volumes:
      - /docker/metube/downloads:/data
    command:
      - sh
      - -c
      - >
        while true; do
        find /data -mindepth 2 -type f -not -path '/data/.metube/*'
        -cmin +$$((RETENTION_HOURS * 60)) -print -delete;
        sleep 900; done

networks:
  docker-lan:
    external: true
  backend:
    driver: bridge
